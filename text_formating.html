<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formating</title>
</head>
<body>
    <p>
        This normal text
    </p>
    <p>
        This <b>Bold</b> text
    </p>
    <p>
        This <i>italic</i> text
    </p>
    <p>
        This <u>underline</u> text
    </p>
    <p>
        This <del>deleted</del> text
    </p>
    <p>
        This <big>big</big> text
    </p>
    <p>
        This <small>small</small> text
    </p>
    <p>
        This <sub>Subcript</sub> text
    </p>
    <p>
        This <sup>superscript</sup> text
    </p>
    <p>
        This <tt>monospaced</tt> text
    </p>
    <p>
        This <mark style="background-color: rgb(238, 144, 197);">higlighted</mark> text
    </p>
</body>
</html>
